name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and check export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Backend tests
        run: npm test

      # Builds the full server app (with type checking) and the static preview in out/.
      - name: Build
        run: npm run build

      - name: Check exported pages and local links
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
